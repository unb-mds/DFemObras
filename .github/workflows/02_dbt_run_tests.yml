name: 02 - dbt Build e Testes

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: 

jobs:
  dbt_build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dbt e dependências
        run: |
          python -m pip install --upgrade pip
          # Pinned duckdb to 1.4.4 for MotherDuck compatibility
          pip install duckdb==1.4.4 dbt-duckdb

      - name: Configurar dbt profiles.yml
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          mkdir -p ~/.dbt
          echo "df_em_obras_profile:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: 'md:obras_df'
                motherduck_token: '${{ secrets.MOTHERDUCK_TOKEN }}'" > ~/.dbt/profiles.yml

      - name: Executar dbt deps e build
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          # We point to ~/.dbt explicitly to ensure it finds the file we just created
          dbt deps --project-dir $GITHUB_WORKSPACE/data_eng/transform --profiles-dir ~/.dbt
          dbt build --project-dir $GITHUB_WORKSPACE/data_eng/transform --profiles-dir ~/.dbt
